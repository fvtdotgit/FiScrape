name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install -U pip

      # Install your package (editable) + core deps used in tests.
      # Avoid relying on a [dev] extra so CI doesn't fail if it's not defined.
      - name: Install package and deps
        run: |
          pip install -e .
          pip install pytest pytest-cov pandas numpy yfinance

      # Optional: show versions to help debug CI env mismatches
      - name: Debug versions
        run: |
          python -V
          python -c "import pandas, numpy, yfinance; print('pandas', pandas.__version__, 'numpy', numpy.__version__, 'yfinance', yfinance.__version__)"

      - name: Run tests
        env:
          # If your code reads envs to configure logging level, set them here:
          PYTHONWARNINGS: default
        run: pytest -q
