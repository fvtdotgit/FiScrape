name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          # If your package has no setup/pyproject, just set PYTHONPATH below.

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest -q
