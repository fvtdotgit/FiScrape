[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"app_core.py" = ["PLR0912", "PLR0913", "PLR0915"]
"fiscrape_core/fundamentals.py" = ["PLR0912", "PLR0915"]
"fiscrape_core/snapshot.py" = ["PLR0913"]
"fiscrape_core/core.py" = ["E501"]
"tests/*.py" = ["PLR2004", "PLR0913"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiscrape"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["fiscrape_core*"]
